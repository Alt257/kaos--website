<section class="match-impro-messages">
  <h2>Messages en temps réel</h2>

  <table>
    <thead>
      <tr>
        <th scope="col">broadcastedAt</th>
        <th scope="col">receivedAt</th>
        <th scope="col">content</th>
      </tr>
    </thead>
@if (message$ | async; as message) {
    <tbody>
      <tr>
        <td>{{ message.broadcastedAt | date:'HH:mm:ss' }}</td>
        <td>{{ message.receivedAt | date:'HH:mm:ss' }}</td>
        <td>{{ message.content }}</td>
      </tr>
    </tbody>
}
  </table>
</section>
